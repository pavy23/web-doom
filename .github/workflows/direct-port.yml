name: Build direct LinuxDOOM browser port

on:
  push:
    branches: ["direct-linuxdoom"]
    paths:
      - "direct-port/**"
      - "mcp/**"
      - ".github/workflows/direct-port.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-linuxdoom-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout direct port branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Emscripten 6.0.5
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 6.0.5
          /tmp/emsdk/emsdk activate 6.0.5

      - name: Fetch pristine id Software LinuxDOOM 1.10
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/id-Software/DOOM.git /tmp/id-doom
          git -C /tmp/id-doom checkout a77dfb96cb91780ca334d0d4cfd86957558007e0
          test -f /tmp/id-doom/linuxdoom-1.10/d_main.c

      - name: Fetch and verify DOOM shareware data
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://www.libsdl.org/projects/doom/data/doom1.wad.zip -o /tmp/doom1.wad.zip
          rm -rf /tmp/doom-shareware
          mkdir -p /tmp/doom-shareware
          unzip -j /tmp/doom1.wad.zip -d /tmp/doom-shareware
          WAD="$(find /tmp/doom-shareware -type f -iname 'doom1.wad' | head -n1)"
          test -n "$WAD"
          cp "$WAD" /tmp/id-doom/linuxdoom-1.10/doom1.wad
          test "$(head -c4 /tmp/id-doom/linuxdoom-1.10/doom1.wad)" = "IWAD"
          test "$(stat -c%s /tmp/id-doom/linuxdoom-1.10/doom1.wad)" -eq 4196020
          echo "5f4eb849b1af12887dec04a2a12e5e62  /tmp/id-doom/linuxdoom-1.10/doom1.wad" | md5sum -c -

          python3 - <<'PY'
          import struct
          from pathlib import Path
          wad = Path('/tmp/id-doom/linuxdoom-1.10/doom1.wad').read_bytes()
          count, directory = struct.unpack_from('<II', wad, 4)
          found = None
          for i in range(count):
              pos, size, raw_name = struct.unpack_from('<II8s', wad, directory + i * 16)
              name = raw_name.split(b'\0', 1)[0].decode('ascii').upper()
              if name == 'GENMIDI':
                  found = wad[pos:pos + size]
                  break
          assert found is not None, 'GENMIDI lump missing from shareware IWAD'
          assert found[:8] == b'#OPL_II#', 'unexpected GENMIDI header'
          assert len(found) >= 8 + (128 + 47) * 36, 'GENMIDI instrument table truncated'
          print('Verified GENMIDI:', len(found), 'bytes')
          PY

      - name: Install our browser platform layer
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/id-doom/linuxdoom-1.10
          cp direct-port/i_video_web.c        "$SRC/i_video.c"
          cp direct-port/i_system_web.c       "$SRC/i_system.c"
          cp direct-port/i_sound_web.c        "$SRC/i_sound.c"
          cp direct-port/i_music_opl_bridge.c "$SRC/i_music_opl_bridge.c"
          cp direct-port/i_net_web.c          "$SRC/i_net.c"
          cp direct-port/Makefile.web         "$SRC/Makefile.web"
          cp direct-port/shell.html           "$SRC/shell.html"
          python3 direct-port/apply_compat.py "$SRC"

      - name: Compile original LinuxDOOM with our web layer
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/emsdk/emsdk_env.sh
          cd /tmp/id-doom/linuxdoom-1.10
          emmake make -f Makefile.web
          test -s webdoom.html
          test -s webdoom.js
          test -s webdoom.wasm
          test -s webdoom.data
          test "$(od -An -tx1 -N4 webdoom.wasm | tr -d ' \n')" = "0061736d"
          ! grep -q "Emscripten-Generated Code" webdoom.html
          grep -q "LINUXDOOM 1.10" webdoom.html
          grep -q "MCP CONNECTED" webdoom.html
          grep -q "MCP AUTHORING" webdoom.html
          grep -q "DoomControl" webdoom.html
          grep -q "spawnEnemy" webdoom.html
          grep -q "removeNearestEnemy" webdoom.html
          grep -q "getSectors" webdoom.html
          grep -q "setSectorLight" webdoom.html
          grep -q "getChangeSet" webdoom.html
          grep -q "exportPwad" webdoom.html
          grep -q "load_pwad" webdoom.js
          grep -q "reload_current_map" webdoom.js
          grep -q "get_linedefs" webdoom.js
          grep -q "set_linedef_action" webdoom.js
          grep -q "activate_linedef" webdoom.js
          grep -q "get_visuals" webdoom.js
          grep -q "list_visual_assets" webdoom.js
          grep -q "set_wall_texture" webdoom.js
          grep -q "set_sector_flat" webdoom.js
          grep -q "set_playtest_paused" webdoom.js
          grep -q "step_playtest_tics" webdoom.js
          grep -q "get_playtest_telemetry" webdoom.js
          grep -q "reset_playtest_metrics" webdoom.js
          grep -q "capture_frame" webdoom.js
          grep -q "queue_agent_input" webdoom.js
          grep -q "cancel_agent_input" webdoom.js
          grep -q "get_agent_input_status" webdoom.js
          grep -q "doomctl_queue_agent_input" webdoom.js
          grep -q "doomctl_get_agent_input_status_json" webdoom.js
          grep -q "DoomPlaytestDispatch" webdoom.js
          grep -q "127.0.0.1:3778/playtest" webdoom.js
          grep -q "doom_pause_playtest" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doom_resume_playtest" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doom_step_tics" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doom_get_playtest_telemetry" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doom_reset_playtest_metrics" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doom_capture_frame" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doom_agent_input_status" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doom_cancel_agent_input" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doom_run_input" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doom_run_input_sequence" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "type: 'image'" "$GITHUB_WORKSPACE/mcp/playtest_server.js"
          grep -q "doomctl_agent_after_world_tic" "$GITHUB_WORKSPACE/direct-port/doom_playtest.c"
          grep -q "doomctl_apply_agent_ticcmd" "$GITHUB_WORKSPACE/direct-port/doom_agent_input.c"
          grep -q "doomctl_queue_agent_input" "$GITHUB_WORKSPACE/direct-port/doom_agent_input.c"
          grep -q "doomctl_get_visuals_json" "$GITHUB_WORKSPACE/direct-port/doom_visuals.c"
          grep -q "doomctl_get_linedefs_json" "$GITHUB_WORKSPACE/direct-port/doom_linedefs.c"
          grep -q "doomctl_load_pwad_json" "$GITHUB_WORKSPACE/direct-port/doom_reload.c"
          grep -q "lumpcache" "$GITHUB_WORKSPACE/direct-port/doom_reload.c"

      - name: Publish direct-port preview under /direct/
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          rm -rf /tmp/publish-main
          git worktree add -B publish-main /tmp/publish-main origin/main

          rm -rf /tmp/publish-main/direct
          mkdir -p /tmp/publish-main/direct
          cp /tmp/id-doom/linuxdoom-1.10/webdoom.html  /tmp/publish-main/direct/index.html
          cp /tmp/id-doom/linuxdoom-1.10/webdoom.js    /tmp/publish-main/direct/webdoom.js
          cp /tmp/id-doom/linuxdoom-1.10/webdoom.wasm  /tmp/publish-main/direct/webdoom.wasm
          cp /tmp/id-doom/linuxdoom-1.10/webdoom.data  /tmp/publish-main/direct/webdoom.data
          cp direct-port/opl_music.js                   /tmp/publish-main/direct/opl_music.js

          cat > /tmp/publish-main/direct/SOURCE.txt <<'EOF'
          Direct browser port of id Software LinuxDOOM 1.10
          =================================================

          Engine/game source baseline:
          https://github.com/id-Software/DOOM
          pinned commit: a77dfb96cb91780ca334d0d4cfd86957558007e0

          Browser platform and MCP source:
          https://github.com/pavy23/web-doom/tree/direct-linuxdoom/direct-port
          https://github.com/pavy23/web-doom/tree/direct-linuxdoom/mcp

          Build: Emscripten 6.0.5 + SDL2 + SDL2_mixer.
          Gameplay/rendering/game-state remain id Software LinuxDOOM.

          Audio:
          - Direct DMX type-3 SFX playback through SDL2_mixer.
          - Vanilla/DMX-compatible OPL behavior from pinned Chocolate Doom
            commit 410d96855b5df5410ff591a90efeafa889119224.
          - Nuked OPL3 v1.8 in OPL2-compatible nine-voice mode by default.

          MCP / AI authoring + autonomous playtest (v0.8):
          - Persistent authoring still rewrites only THINGS, LINEDEFS, SIDEDEFS
            and SECTORS while topology/BSP-derived map lumps stay unchanged.
          - v0.7 pause, exact P_Ticker stepping, telemetry and PNG frame capture
            remain the observation layer.
          - doom_agent_input.c adds a bounded console-player ticcmd override for
            forward/back, strafe, turn, attack and use. It is playtest-only.
          - patch_agent_input.py inserts the override after LinuxDOOM G_Ticker()
            selects the actual local net/demo command and before gameplay consumes it.
          - Autonomous input lifetime is decremented only after an actual P_Ticker
            world update, so paused browser frames cannot consume planned input.
          - doom_run_input combines one bounded input with an exact world-tic budget,
            leaving the world paused for deterministic frame/telemetry evaluation.
          - doom_run_input_sequence executes up to 16 short actions with a bounded
            total simulation budget and stops early on player death.
          - AI actions never synthesize BT_SPECIAL/save/pause/weapon-change commands
            and never persist into exported PWADs.
          - Authoring remains on 127.0.0.1:3777/control; playtest/vision/agent traffic
            uses 127.0.0.1:3778/playtest only when loaded through the local MCP proxy.

          Loop:
          AI inspect -> edit -> short input -> exact tics -> frame + telemetry
          -> evaluate -> next action or revise -> PWAD export/reload.

          Shareware game data:
          - Redistributable DOOM shareware IWAD fetched from SDL archive during CI.
          - size: 4,196,020 bytes
          - MD5: 5f4eb849b1af12887dec04a2a12e5e62
          EOF

          touch /tmp/publish-main/.nojekyll
          git -C /tmp/publish-main add direct .nojekyll
          if git -C /tmp/publish-main diff --cached --quiet; then
            echo "No preview changes to publish."
            exit 0
          fi
          git -C /tmp/publish-main commit -m "Publish direct LinuxDOOM browser port preview"
          git -C /tmp/publish-main push origin HEAD:main