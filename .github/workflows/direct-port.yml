name: Build direct LinuxDOOM browser port

on:
  push:
    branches: ["direct-linuxdoom"]
    paths:
      - "direct-port/**"
      - "mcp/**"
      - ".github/workflows/direct-port.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-linuxdoom-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout direct port branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Emscripten 6.0.5
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 6.0.5
          /tmp/emsdk/emsdk activate 6.0.5

      - name: Fetch pristine id Software LinuxDOOM 1.10
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/id-Software/DOOM.git /tmp/id-doom
          git -C /tmp/id-doom checkout a77dfb96cb91780ca334d0d4cfd86957558007e0
          test -f /tmp/id-doom/linuxdoom-1.10/d_main.c

      - name: Fetch and verify DOOM shareware data
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://www.libsdl.org/projects/doom/data/doom1.wad.zip \
            -o /tmp/doom1.wad.zip
          rm -rf /tmp/doom-shareware
          mkdir -p /tmp/doom-shareware
          unzip -j /tmp/doom1.wad.zip -d /tmp/doom-shareware
          WAD="$(find /tmp/doom-shareware -type f -iname 'doom1.wad' | head -n1)"
          test -n "$WAD"
          cp "$WAD" /tmp/id-doom/linuxdoom-1.10/doom1.wad
          test "$(head -c4 /tmp/id-doom/linuxdoom-1.10/doom1.wad)" = "IWAD"
          test "$(stat -c%s /tmp/id-doom/linuxdoom-1.10/doom1.wad)" -eq 4196020
          echo "5f4eb849b1af12887dec04a2a12e5e62  /tmp/id-doom/linuxdoom-1.10/doom1.wad" | md5sum -c -

          python3 - <<'PY'
          import struct
          from pathlib import Path
          wad = Path('/tmp/id-doom/linuxdoom-1.10/doom1.wad').read_bytes()
          count, directory = struct.unpack_from('<II', wad, 4)
          found = None
          for i in range(count):
              pos, size, raw_name = struct.unpack_from('<II8s', wad, directory + i * 16)
              name = raw_name.split(b'\0', 1)[0].decode('ascii').upper()
              if name == 'GENMIDI':
                  found = wad[pos:pos + size]
                  break
          assert found is not None, 'GENMIDI lump missing from shareware IWAD'
          assert found[:8] == b'#OPL_II#', 'unexpected GENMIDI header'
          assert len(found) >= 8 + (128 + 47) * 36, 'GENMIDI instrument table truncated'
          print('Verified GENMIDI:', len(found), 'bytes')
          PY

      - name: Install our browser platform layer
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/id-doom/linuxdoom-1.10
          cp direct-port/i_video_web.c        "$SRC/i_video.c"
          cp direct-port/i_system_web.c       "$SRC/i_system.c"
          cp direct-port/i_sound_web.c        "$SRC/i_sound.c"
          cp direct-port/i_music_opl_bridge.c "$SRC/i_music_opl_bridge.c"
          cp direct-port/i_net_web.c          "$SRC/i_net.c"
          cp direct-port/Makefile.web         "$SRC/Makefile.web"
          cp direct-port/shell.html           "$SRC/shell.html"
          python3 direct-port/apply_compat.py "$SRC"

      - name: Compile original LinuxDOOM with our web layer
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/emsdk/emsdk_env.sh
          cd /tmp/id-doom/linuxdoom-1.10
          emmake make -f Makefile.web
          test -s webdoom.html
          test -s webdoom.js
          test -s webdoom.wasm
          test -s webdoom.data
          test "$(od -An -tx1 -N4 webdoom.wasm | tr -d ' \n')" = "0061736d"
          ! grep -q "Emscripten-Generated Code" webdoom.html
          grep -q "LINUXDOOM 1.10" webdoom.html
          grep -q "MCP CONNECTED" webdoom.html
          grep -q "MCP AUTHORING" webdoom.html
          grep -q "DoomControl" webdoom.html
          grep -q "spawnEnemy" webdoom.html
          grep -q "removeNearestEnemy" webdoom.html
          grep -q "getSectors" webdoom.html
          grep -q "setSectorLight" webdoom.html
          grep -q "getChangeSet" webdoom.html
          grep -q "exportPwad" webdoom.html
          grep -q "doom_get_enemies" "$GITHUB_WORKSPACE/mcp/server.js"
          grep -q "doom_get_sectors" "$GITHUB_WORKSPACE/mcp/server.js"
          grep -q "doom_set_sector_light" "$GITHUB_WORKSPACE/mcp/server.js"
          grep -q "doom_spawn_enemy" "$GITHUB_WORKSPACE/mcp/server.js"
          grep -q "doom_remove_nearest_enemy" "$GITHUB_WORKSPACE/mcp/server.js"
          grep -q "doom_get_changeset" "$GITHUB_WORKSPACE/mcp/server.js"
          grep -q "doom_export_pwad" "$GITHUB_WORKSPACE/mcp/server.js"
          grep -q "doomctl_get_sectors_json" "$GITHUB_WORKSPACE/direct-port/doom_control.c"
          grep -q "doomctl_set_sector_light" "$GITHUB_WORKSPACE/direct-port/doom_control.c"
          grep -q "doomctl_get_changeset_json" "$GITHUB_WORKSPACE/direct-port/doom_control.c"
          grep -q "doomctl_export_pwad" "$GITHUB_WORKSPACE/direct-port/doom_control.c"

      - name: Publish direct-port preview under /direct/
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          rm -rf /tmp/publish-main
          git worktree add -B publish-main /tmp/publish-main origin/main

          rm -rf /tmp/publish-main/direct
          mkdir -p /tmp/publish-main/direct
          cp /tmp/id-doom/linuxdoom-1.10/webdoom.html  /tmp/publish-main/direct/index.html
          cp /tmp/id-doom/linuxdoom-1.10/webdoom.js    /tmp/publish-main/direct/webdoom.js
          cp /tmp/id-doom/linuxdoom-1.10/webdoom.wasm  /tmp/publish-main/direct/webdoom.wasm
          cp /tmp/id-doom/linuxdoom-1.10/webdoom.data  /tmp/publish-main/direct/webdoom.data
          cp direct-port/opl_music.js                   /tmp/publish-main/direct/opl_music.js

          cat > /tmp/publish-main/direct/SOURCE.txt <<'EOF'
          Direct browser port of id Software LinuxDOOM 1.10
          =================================================

          Engine/game source baseline:
          https://github.com/id-Software/DOOM
          pinned commit: a77dfb96cb91780ca334d0d4cfd86957558007e0

          Browser platform and MCP authoring source:
          https://github.com/pavy23/web-doom/tree/direct-linuxdoom/direct-port
          https://github.com/pavy23/web-doom/tree/direct-linuxdoom/mcp

          Build system: Emscripten 6.0.5 + SDL2 + SDL2_mixer.
          The gameplay/rendering/game-state code remains id Software LinuxDOOM;
          browser-specific i_video/i_system/i_sound/i_net boundaries and the
          explicit doom_control.c state/authoring surface are maintained here.

          Sound effects:
          - DOOM DMX type-3 DS* lumps are parsed directly into the browser mixer.
          - Original PCM, pitch variation, volume and stereo separation are used.

          Music:
          - The former WebAudio GENMIDI approximation is retired and not loaded.
          - A pinned OPL/MIDI subset is imported at build time from Chocolate Doom:
            commit 410d96855b5df5410ff591a90efeafa889119224
          - MUS timing and Vanilla/DMX-compatible behavior program IWAD GENMIDI
            instruments into OPL registers.
          - Nuked OPL3 v1.8 renders those registers in OPL2-compatible nine-voice
            mode by default and mixes signed 16-bit PCM through SDL2_mixer.
          - I_InitSound() opens the shared mixer before I_InitMusic() attaches the
            OPL post-mix path.
          - LinuxDOOM's commented DOS-style 0..15 * 8 volume handoff is restored.

          MCP / live authoring control (v0.3):
          - doom_control.c is compiled into WASM and only explicitly exported
            EMSCRIPTEN_KEEPALIVE functions are callable; raw memory is not exposed.
          - Enemy state includes canonical names, distance, relative angle,
            P_CheckSight() line-of-sight and forward-view visibility.
          - Episode-1-safe actors can be spawned/removed using LinuxDOOM actor and
            collision functions; these edits are journaled as persistent THINGS changes.
          - Runtime sectors expose floor/ceiling/light/special/tag metadata and the
            current sector. Sector light edits are journaled as persistent SECTORS changes.
          - The in-engine ChangeSet currently records sector-light edits plus spawned
            and removed map things for the current ExMy map.
          - doomctl_export_pwad() writes a PWAD containing the original current-map
            lump set with THINGS and SECTORS rewritten from the ChangeSet.
          - The browser reads the generated PWAD from Emscripten FS and sends its bytes
            through the localhost WebSocket bridge; mcp/server.js writes the .wad under
            mcp/exports/ (or DOOM_MCP_EXPORT_DIR).
          - Debug/play-only mutations such as heal, ammo and player teleport are not
            serialized into PWAD authoring output.
          - CI installs the official MCP server dependency and imports/constructs
            createMcpServer() as a self-test before compiling the game.

          Browser UI:
          - direct-port/shell.html replaces Emscripten's demo shell.
          - User gesture starts the game/unlocks browser audio.
          - Localhost MCP mode displays MCP CONNECTED after the WebSocket attaches.

          Shareware game data:
          - The included IWAD is the redistributable DOOM shareware data fetched
            from SDL's long-standing DOOM project archive during CI.
          - size: 4,196,020 bytes
          - MD5: 5f4eb849b1af12887dec04a2a12e5e62
          EOF

          touch /tmp/publish-main/.nojekyll
          git -C /tmp/publish-main add direct .nojekyll
          if git -C /tmp/publish-main diff --cached --quiet; then
            echo "No preview changes to publish."
            exit 0
          fi
          git -C /tmp/publish-main commit -m "Publish direct LinuxDOOM browser port preview"
          git -C /tmp/publish-main push origin HEAD:main
