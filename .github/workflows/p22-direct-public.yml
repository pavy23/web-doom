name: Build P2.2 public direct launcher

on:
  pull_request:
    branches: ["main"]
    paths:
      - "direct-port/**"
      - "mcp/**"
      - ".github/workflows/p22-direct-public.yml"
      - "README.md"
  push:
    branches: ["main"]
    paths:
      - "direct-port/**"
      - "mcp/**"
      - ".github/workflows/p22-direct-public.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p22-direct-public-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MCP dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix mcp --ignore-scripts --no-audit --no-fund
          cd mcp
          npx playwright install chromium

      - name: Install Emscripten 6.0.5
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 6.0.5
          /tmp/emsdk/emsdk activate 6.0.5

      - name: Fetch pinned LinuxDOOM and verified shareware IWAD
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/id-doom /tmp/doom-shareware
          git clone https://github.com/id-Software/DOOM.git /tmp/id-doom
          git -C /tmp/id-doom checkout a77dfb96cb91780ca334d0d4cfd86957558007e0
          SRC=/tmp/id-doom/linuxdoom-1.10
          curl -fL --retry 3 https://www.libsdl.org/projects/doom/data/doom1.wad.zip -o /tmp/doom1.wad.zip
          mkdir -p /tmp/doom-shareware
          unzip -j /tmp/doom1.wad.zip -d /tmp/doom-shareware
          WAD="$(find /tmp/doom-shareware -type f -iname 'doom1.wad' | head -n1)"
          test -n "$WAD"
          cp "$WAD" "$SRC/doom1.wad"
          test "$(head -c4 "$SRC/doom1.wad")" = "IWAD"
          test "$(stat -c%s "$SRC/doom1.wad")" -eq 4196020
          echo "5f4eb849b1af12887dec04a2a12e5e62  $SRC/doom1.wad" | md5sum -c -

      - name: Install P2.2 browser platform and launcher
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/id-doom/linuxdoom-1.10
          cp direct-port/i_video_web.c        "$SRC/i_video.c"
          cp direct-port/i_system_web.c       "$SRC/i_system.c"
          cp direct-port/i_sound_web.c        "$SRC/i_sound.c"
          cp direct-port/i_music_opl_bridge.c "$SRC/i_music_opl_bridge.c"
          cp direct-port/i_net_localbots.c    "$SRC/i_net.c"
          cp direct-port/Makefile.web         "$SRC/Makefile.web"
          cp direct-port/shell.html           "$SRC/shell.html"
          python3 direct-port/apply_compat.py "$SRC"
          python3 direct-port/patch_local_bot_shell.py "$SRC"
          python3 direct-port/patch_public_p22_launcher.py "$SRC"
          grep -q "PLAY CLASSIC DOOM" "$SRC/shell.html"
          grep -q "PLAY AI DEATHMATCH" "$SRC/shell.html"
          grep -q "stagePublicDeathmatchWad" "$SRC/shell.html"

      - name: Build bot-capable LinuxDOOM WebAssembly
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/emsdk/emsdk_env.sh
          SRC=/tmp/id-doom/linuxdoom-1.10
          cd "$SRC"
          emmake make -f Makefile.web prepare-opl prepare-control validate-mcp
          cp "$GITHUB_WORKSPACE/direct-port/doom_multi_agent.c" doom_agent_input.c
          python3 "$GITHUB_WORKSPACE/direct-port/patch_multi_agent.py" "$SRC"
          P22_EXTRA="--pre-js $GITHUB_WORKSPACE/direct-port/local_bot_live.js -sEXPORTED_FUNCTIONS=_main,_doomctl_queue_player_input,_doomctl_cancel_player_input,_doomctl_get_player_input_status_json,_doomctl_get_players_json,_doomctl_get_player_perception_json,_doomctl_get_local_player_capacity"
          emmake make -f Makefile.web webdoom.html EXTRA_EMFLAGS="$P22_EXTRA"
          test -s webdoom.html
          test -s webdoom.js
          test -s webdoom.wasm
          test -s webdoom.data
          grep -q "PLAY CLASSIC DOOM" webdoom.html
          grep -q "PLAY AI DEATHMATCH" webdoom.html
          grep -q "DoomLocalBots" webdoom.js
          grep -q "doomctl_get_local_player_capacity" webdoom.js
          grep -q "doomctl_queue_player_input" webdoom.js

      - name: Generate deterministic P2.2 public arena
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p22-public
          node mcp/build_p22_demo_wad.mjs /tmp/p22-public/p22-demo.wad | tee /tmp/p22-demo-report.json
          test -s /tmp/p22-public/p22-demo.wad
          test "$(head -c4 /tmp/p22-public/p22-demo.wad)" = "PWAD"

      - name: Assemble public /direct/ candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/id-doom/linuxdoom-1.10
          cp "$SRC/webdoom.html" /tmp/p22-public/index.html
          cp "$SRC/webdoom.js" /tmp/p22-public/webdoom.js
          cp "$SRC/webdoom.wasm" /tmp/p22-public/webdoom.wasm
          cp "$SRC/webdoom.data" /tmp/p22-public/webdoom.data
          cp direct-port/opl_music.js /tmp/p22-public/opl_music.js
          test -s /tmp/p22-public/index.html
          test -s /tmp/p22-public/webdoom.js
          test -s /tmp/p22-public/webdoom.wasm
          grep -q "PLAY CLASSIC DOOM" /tmp/p22-public/index.html
          grep -q "PLAY AI DEATHMATCH" /tmp/p22-public/index.html

      - name: Start candidate HTTP server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 --directory /tmp/p22-public >/tmp/p22-public-http.log 2>&1 &
          echo $! >/tmp/p22-public-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/index.html >/dev/null
          curl -fsS http://127.0.0.1:8000/p22-demo.wad >/dev/null

      - name: Verify Classic and AI Deathmatch public modes
        timeout-minutes: 8
        shell: bash
        env:
          DOOM_P22_PUBLIC_URL: http://127.0.0.1:8000/
        run: |
          set -euo pipefail
          cd mcp
          node p22_public_direct_selftest.mjs

      - name: Stop candidate HTTP server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p22-public-http.pid ]; then
            kill "$(cat /tmp/p22-public-http.pid)" 2>/dev/null || true
          fi

      - name: Publish verified P2.2 build under /direct/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          rm -rf /tmp/publish-main
          git worktree add -B publish-p22-direct /tmp/publish-main origin/main
          rm -rf /tmp/publish-main/direct
          mkdir -p /tmp/publish-main/direct
          cp /tmp/p22-public/index.html     /tmp/publish-main/direct/index.html
          cp /tmp/p22-public/webdoom.js    /tmp/publish-main/direct/webdoom.js
          cp /tmp/p22-public/webdoom.wasm  /tmp/publish-main/direct/webdoom.wasm
          cp /tmp/p22-public/webdoom.data  /tmp/publish-main/direct/webdoom.data
          cp /tmp/p22-public/opl_music.js  /tmp/publish-main/direct/opl_music.js
          cp /tmp/p22-public/p22-demo.wad  /tmp/publish-main/direct/p22-demo.wad
          cat > /tmp/publish-main/direct/SOURCE.txt <<'EOF'
          P2.2 direct browser build of id Software LinuxDOOM 1.10
          =======================================================

          Engine baseline: id Software DOOM, pinned commit
          a77dfb96cb91780ca334d0d4cfd86957558007e0

          Toolchain: Emscripten 6.0.5 + SDL2 + SDL2_mixer.
          Music: pinned Vanilla/DMX-compatible Chocolate Doom OPL subsystem.

          Public launcher modes:
          - PLAY CLASSIC DOOM: original shareware campaign, one local player.
          - PLAY AI DEATHMATCH: generated P2.2 E1M1 arena, one human plus three
            real LinuxDOOM player slots controlled by Easy / Normal / Hard bots.

          The bundled p22-demo.wad is generated deterministically by
          mcp/build_p22_demo_wad.mjs and rebuilt with the pinned ZDBSP pipeline.

          P2.2 local multiplayer is intentionally single-process and netgame=false.
          Remote browser synchronization remains P3.0 work.
          EOF
          touch /tmp/publish-main/.nojekyll
          git -C /tmp/publish-main add direct .nojekyll
          if git -C /tmp/publish-main diff --cached --quiet; then
            echo "Verified P2.2 direct build is unchanged."
            exit 0
          fi
          git -C /tmp/publish-main commit -m "Publish P2.2 dual-mode direct build [skip ci]"
          git -C /tmp/publish-main push origin HEAD:main
