name: Geometry v2 diagnostic

on:
  push:
    branches: ["direct-linuxdoom"]
    paths:
      - "mcp/geometry.js"
      - "mcp/nodebuilder.js"
      - "mcp/geometry_selftest.mjs"
      - ".github/workflows/geometry-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-linuxdoom

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run and persist geometry integration result
        shell: bash
        run: |
          set +e
          cd mcp
          node geometry_selftest.mjs > geometry-selftest.log 2>&1
          code=$?
          printf '\nEXIT_CODE=%s\n' "$code" >> geometry-selftest.log
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/geometry-selftest.log
          git commit -m "Record geometry v2 self-test result" || true
          git push origin HEAD:direct-linuxdoom
          exit "$code"
